<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subdivide Finder · Utopian Capital</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="sf-adapter.js"></script>
<script src="counties.js"></script>
<style>
:root{
  --bg:#F8F5EF; --surface:#FFFFFF; --surface-2:#F1EDE3;
  --ink:#1A1918; --ink-2:#4A4642; --ink-3:#857F76;
  --border:#E5DFD1; --border-strong:#C9C0AC;
  --accent:#2E5D3A; --accent-ink:#FAFBF8; --accent-soft:#E4EEDF;
  --gold:#C69B4F; --gold-soft:#F5EBD6; --gold-ink:#6B4A0E;
  --danger:#B8422E; --danger-soft:#FBE9E4;
  --info-soft:#E4EBF3; --info-ink:#1F3C5C;
  --warn-soft:#F7ECD0; --warn-ink:#6B4A0E;
  --success-soft:#DEEDD8; --success-ink:#285B18;
  --purple-soft:#E7E4F1; --purple-ink:#38315C;
  --shadow-sm:0 1px 2px rgba(20,17,10,.04); --shadow-md:0 4px 16px rgba(20,17,10,.06); --shadow-lg:0 12px 40px rgba(20,17,10,.12);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .small{font-size:12.5px}

/* top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand img{height:40px;width:auto;display:block}
.brand .sep{width:1px;height:26px;background:var(--border)}
.brand .name{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.top-right a{color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--ink);transition:all .15s var(--ease);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:#254A2E;border-color:#254A2E}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.scard:focus-visible,.dcard:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* page */
.page{max-width:1320px;margin:0 auto;padding:28px 24px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.02em;line-height:1.15}
.page-head p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);text-decoration:none;font-size:13px;margin-bottom:10px}
.crumb:hover{color:var(--ink)}
h2.sec{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:32px 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec .muted{font-family:var(--sans);font-size:13px;font-weight:500}
.empty{padding:36px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-lg)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--pb,var(--surface-2));color:var(--pc,var(--ink-2));white-space:nowrap}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* alert strip */
.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-lg);background:var(--danger-soft);color:var(--danger);font-weight:500;margin-bottom:18px;flex-wrap:wrap}
.alert.info{background:var(--info-soft);color:var(--info-ink)}
.alert p{flex:1;min-width:220px}

/* searches grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 18px 16px;box-shadow:var(--shadow-sm);text-align:left;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s var(--ease),transform .15s var(--ease),border-color .15s var(--ease);width:100%}
.scard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--border-strong)}
.scard .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.scard h3{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.01em;line-height:1.25}
.scard .sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
.funnel{display:flex;align-items:baseline;gap:8px;color:var(--ink-2);font-size:13px}
.funnel b{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--ink)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend b{font-weight:600;color:var(--ink)}

/* new search form */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm)}
.form-grid{display:grid;grid-template-columns:120px 140px 1fr;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);font-size:13.5px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state{font-size:12.5px;color:var(--ink-3)}
.state.err{color:var(--danger)} .state.ok{color:var(--success-ink)}

/* summary */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat .l{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.02em;margin-top:2px;line-height:1.2}
.stat .s{font-size:12px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;margin-top:12px}
.panel h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:12px}
.hbar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.hbar .track{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.hbar .track span{display:block;height:100%;border-radius:999px}
.hbar .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:0 8px 8px;border-bottom:1px solid var(--border)}
table.t td{padding:8px;border-bottom:1px solid var(--border)}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
.foot{margin-top:10px;font-size:12px;color:var(--ink-3)}

/* pipeline board */
.board-bar{display:flex;gap:10px;align-items:center;margin:32px 0 12px;flex-wrap:wrap}
.board-bar h2.sec{margin:0}
.board-bar input{max-width:280px;margin-left:auto}
.board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.col-head i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.col-head b{font-size:13px;font-weight:600}
.col-head .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface);border-radius:999px;padding:0 8px}
.col-hint{font-size:11.5px;color:var(--ink-3);padding:0 4px 4px;line-height:1.4}
.col-empty{font-size:12px;color:var(--ink-3);text-align:center;padding:14px 6px;border:1px dashed var(--border-strong);border-radius:var(--r-md)}
.dcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cc,var(--border-strong));border-radius:var(--r-md);padding:10px 11px;text-align:left;width:100%;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow-sm);transition:box-shadow .15s var(--ease),transform .15s var(--ease)}
.dcard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.dcard.sel{outline:2px solid var(--accent);outline-offset:1px}
.dcard .a{font-weight:600;font-size:13px;line-height:1.3}
.dcard .m{font-size:12px;color:var(--ink-3)}
.dcard .o{font-size:12px;color:var(--ink-2)}
.dcard .tags{display:flex;gap:4px;flex-wrap:wrap}
details.aside{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
details.aside>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details.aside>summary::before{content:"▸";color:var(--ink-3);transition:transform .15s}
details.aside[open]>summary::before{transform:rotate(90deg)}
.alist{padding:0 8px 8px}
.arow{display:grid;grid-template-columns:minmax(0,1.4fr) 110px minmax(0,2fr);gap:12px;align-items:center;padding:8px;border-top:1px solid var(--border);text-align:left;width:100%;font-size:13px}
.arow:hover{background:var(--surface-2)}
.arow .why{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(26,25,24,.28);z-index:50;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--bg);z-index:51;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slide .2s var(--ease)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{animation:none}.scard,.dcard{transition:none}}
.dr-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;z-index:2}
.dr-head .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:var(--r-sm);font-size:20px;color:var(--ink-3)}
.dr-head .x:hover{background:var(--surface-2);color:var(--ink)}
.dr-head h2{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.01em;padding-right:36px;line-height:1.25}
.dr-head .m{color:var(--ink-3);font-size:12.5px;margin-top:4px}
.dr-head .row{margin-top:10px}
.dr-body{padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.box>.lbl,.lbl{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:block}
.note{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;font-size:13px;color:var(--ink-2)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.fig .k{display:block;font-size:11.5px;color:var(--ink-3)}
.fig .v{display:block;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.compose{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-md);background:var(--warn-soft);color:var(--warn-ink);font-size:13px}
.convo{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;background:var(--surface)}
.msg.in{background:var(--accent-soft);border-color:#CFE0C8}
.msg.out>summary{cursor:pointer;list-style:none}
.msg.sys{background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.msg-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.msg-head b{color:var(--ink)}
.msg .body{white-space:pre-wrap;font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.quoted summary{cursor:pointer;font-size:12px;color:var(--ink-3);margin-top:6px}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;align-items:center}
.tsep{height:1px;background:var(--border);margin:6px 0}

/* nav tabs */
.tabs{display:flex;gap:2px;margin-left:8px}
.tabs a{padding:8px 12px;border-radius:var(--r-md);color:var(--ink-2);font-size:13.5px;font-weight:500;text-decoration:none;height:36px;display:flex;align-items:center}
.tabs a:hover{background:var(--surface-2);color:var(--ink)}
.tabs a[aria-current=page]{background:var(--ink);color:var(--surface)}
/* criteria */
.crit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.unit-wrap{display:flex;align-items:center;gap:6px}
.unit-wrap input{flex:1;min-width:0}
.unit{font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.help{font-size:11.5px;font-weight:400;color:var(--ink-3);line-height:1.35}
label.crit.changed input,label.crit.changed select{border-color:var(--gold);background:var(--gold-soft)}
label.crit.changed .help{color:var(--gold-ink);font-weight:600}
.crit-toggles{display:flex;flex-direction:column;gap:6px;margin-top:12px}
label.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
label.check.changed{color:var(--gold-ink);font-weight:600}
.panel h3+.crit-grid{margin-top:0}
.def{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--ink-2)}
.def:last-child{border-bottom:0}
ol.steps,ul.steps{padding-left:36px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink-2)}
.crit-line{font-size:12.5px;color:var(--ink-2);margin:-8px 0 0;max-width:110ch}
.crit-line .chg{color:var(--gold-ink);font-weight:600}
/* county picker */
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px;max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-md);padding:6px;background:var(--bg)}
.citem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);font-size:13px;cursor:pointer;background:var(--surface);border:1px solid transparent}
.citem:hover{border-color:var(--border-strong)}
.citem.on{border-color:var(--accent);background:var(--accent-soft)}
.citem .cn{flex:1;font-weight:500}
.citem .cl{font-size:11px;color:var(--ink-3)}
.crit-box{margin-top:14px;border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;background:var(--bg)}
.crit-toggle{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;font-size:13px;flex-wrap:wrap}
/* land portal map */
.dr-map{background:var(--surface);border-bottom:1px solid var(--border)}
.dr-map iframe{display:block;width:100%;height:360px;border:0;background:#0e2f33}
.map-foot{padding:8px 20px;justify-content:space-between}
@media (max-width:640px){.dr-map iframe{height:280px}.def{grid-template-columns:1fr}}

.board{grid-template-columns:repeat(7,minmax(165px,1fr))!important}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.dcard[draggable=true]{cursor:grab}
.dcard.dragging{opacity:.45}
details.aside.drop>summary{background:var(--accent-soft)}
.note.ok-note{background:var(--success-soft);color:var(--success-ink)}
.lp-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--border)}
.frow:first-of-type{border-top:0}
.fname{text-align:left;font-weight:600;font-size:13px;color:var(--accent);text-decoration:underline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{white-space:nowrap}
input[type=file]{font-size:12.5px;max-width:100%}
@media (max-width:640px){.frow{grid-template-columns:auto 1fr auto}.fmeta{display:none}}
/* sign-in gate */
#sf-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#sf-gate form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg)}
#sf-gate img{height:42px;width:auto;align-self:flex-start}
#sf-gate h1{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:-.01em}

@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:640px){.page{padding:20px 14px 60px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid,.grid2,.figs{grid-template-columns:1fr 1fr}.sgrid{grid-template-columns:1fr}.arow{grid-template-columns:1fr}.topbar{padding:10px 14px}.brand img{height:28px}}
</style>
</head>
<body>
<div id="sf-gate" hidden>
  <form id="sf-gate-form">
    <img src="logo.png" alt="Utopian Capital">
    <h1>Subdivide Finder</h1>
    <p class="muted small">Sign in with your Utopian CRM account.</p>
    <label class="f">Email<input type="email" id="sf-email" autocomplete="username" required></label>
    <label class="f">Password<input type="password" id="sf-pass" autocomplete="current-password" placeholder="Leave blank to get an email link"></label>
    <button class="btn primary" type="submit" style="justify-content:center">Sign in</button>
    <p class="small muted" id="sf-gate-msg"></p>
  </form>
</div>
<header class="topbar">
  <a class="brand" href="#/" aria-label="Subdivide Finder home"><img src="logo.png" alt="Utopian Capital"><span class="sep"></span><span class="name">Subdivide Finder</span></a>
  <nav class="tabs" id="tabs" aria-label="Sections"><a href="#/" id="tab-searches">Searches</a><a href="#/criteria" id="tab-criteria">Criteria</a></nav>
  <div class="top-right"><span id="fresh"></span><span id="sf-who"></span><a href="#" id="sf-signout">Sign out</a></div>
</header>
<main class="page" id="view"></main>
<div id="drawer-slot"></div>
<script>
(function () {
  "use strict";
  var ME = "jay@utopiancapitalinvest.com";
  var TZ = "America/Chicago";

    var msgs = convoFor(o);
    var gmailUrl = o.viewUrl || ("https://mail.google.com/mail/?authuser=" + ME + "#all/" + o.threadId);
    var box = h("div", { className: "box", id: "card-" + o.threadId },
      h("div", { className: "row", style: "justify-content:space-between" }, h("span", { className: "lbl", style: "margin:0", text: "Email thread · " + (o.subject || o.property) }), pill(bucket.short, "var(--surface-2)", "var(--ink-2)", true)),
      h("div", { className: "links", style: "margin-top:6px" },
        o.threadId ? h("a", { href: gmailUrl, target: "_blank", rel: "noopener", text: "Open in Gmail" }) : null,
        h("span", { className: "muted", text: "Sent " + fmtDT(o.sentAt) + " to " + (o.to || []).join(", ") + ((o.cc && o.cc.length) ? " (cc " + o.cc.join(", ") + ")" : "") })));
    var convo = h("div", { className: "convo" });
    if (msgs.length) msgs.forEach(function (m) { convo.appendChild(msgView(m)); });
    else {
      var did = "s-" + o.threadId;
      var det = h("details", { className: "msg out", id: did, open: !!S.open[did], ontoggle: function () { S.open[did] = det.open; } },
        h("summary", null, h("div", { className: "msg-head" }, h("span", null, h("b", { text: "You" }), " · first email"), h("span", { text: fmtDT(o.sentAt) }))),
        h("div", { className: "body", text: o.sentBody || "" }));
      convo.appendChild(det);
      if (o.delivery === "bounced") convo.appendChild(h("div", { className: "msg sys", text: "This email bounced. Text or call the agent" + (o.phone ? " at " + o.phone : "") + "." }));
      else if (!o.syncedAt) convo.appendChild(h("div", { className: "msg sys", text: "Replies show here after Claude's next Gmail check." }));
    }
    if (o.notes) convo.appendChild(h("div", { className: "note", text: o.notes }));
    box.appendChild(convo);
    box.appendChild(h("div", { className: "tsep" }));
    box.appendChild(emailPanel("reply", o.threadId, o, d && !d._orphan ? d : null));
    return box;
  }

  function bannerContent() { return null; }

  function fig(k, v) { return h("div", { className: "fig" }, h("span", { className: "k", text: k }), h("span", { className: "v", text: (v === "" || v == null) ? "—" : String(v) })); }

  function updateDeal(d, patch) {
    if (!S.db || d._orphan) return;
    S.db.doc("deals/" + d.id).update(patch).catch(function (e) { S.err["deal-" + d.id] = "Couldn't save (" + (e && e.code) + ")."; render(); });
  }

  // ---------- Email: instructions -> Claude drafts -> one-click approve ----------
  // Claude runs the checks (scheduled, or "check Subdivide Finder" in chat): it syncs replies from Gmail,
  // writes drafts for "waiting" instructions, and sends "approved" drafts inside the send hours.
  var CHECK_SLOTS = [[7, 41], [11, 41], [13, 41], [15, 41], [17, 41]];
  function nextCheck() {
    var p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "numeric", hour12: false, weekday: "short" }).formatToParts(new Date());
    var o = {}; p.forEach(function (x) { o[x.type] = x.value; });
    var hr = (+o.hour) % 24, mn = +o.minute, days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], wd = days.indexOf(o.weekday);
    var lbl = function (s) { var h12 = s[0] > 12 ? s[0] - 12 : s[0]; return h12 + ":" + String(s[1]).padStart(2, "0") + (s[0] >= 12 ? " PM" : " AM"); };
    for (var i = 0; i < 8; i++) {
      var day = (wd + i) % 7;
      for (var j = 0; j < CHECK_SLOTS.length; j++) {
        var s = CHECK_SLOTS[j];
        if (i === 0 && (s[0] < hr || (s[0] === hr && s[1] <= mn))) continue;
        return (i === 0 ? "today " : i === 1 ? "tomorrow " : days[day] + " ") + lbl(s);
      }
    }
    return "soon";
  }
  function setIdea(id, body) {
    if (!S.db) return;
    var ref = S.db.doc("ideas/" + id);
    (body ? ref.set(body) : ref.delete()).then(function () { delete S.local["ep-" + id]; render(); })
      .catch(function (e) { S.err["ep-" + id] = "Couldn't save (" + ((e && e.code) || "error") + ")."; render(); });
  }
  var PRESETS = {
    first: "Standard first email from my template. Skip anything the listing already answers and ask about anything the listing and Land Portal disagree on.",
    followup: "Short, friendly follow-up asking if they've had a chance to look at my questions."
  };
  function emailPanel(kind, id, o, d) {
    var idea = S.ideas[id] || {};
    var key = "ep-" + id;
    var st = S.local[key] || (S.local[key] = { instr: "", editing: false, body: null });
    var now = function () { return new Date().toISOString(); };
    var base = { kind: kind, threadId: o ? o.threadId : null, dealId: d ? d.id : ((o && o.dealId) || null), property: d ? d.address : (o && o.property), agent: d && d.agent ? d.agent.name : ((o && o.agent) || ""), runId: d ? d.runId : ((o && (o.runId || o.search)) || "") };
    var save = function (patch) { setIdea(id, Object.assign({}, idea, base, patch)); };
    var saveInstruction = function (text) {
      text = String(text || "").trim();
      if (!text) { S.err[key] = "Type what the email should say first."; render(); return; }
      S.err[key] = null;
      setIdea(id, Object.assign({}, base, { state: "waiting", instruction: text, instructionAt: now(), history: (idea.history || []).concat(idea.state === "sent" ? [{ instruction: idea.instruction, sentAt: idea.sentAt }] : []).slice(-10) }));
    };
    var wrap = h("div", { className: "compose", id: key });
    wrap.appendChild(h("div", { className: "lbl", text: kind === "first" ? "First email to the agent" : "Next email in this thread" }));
    var state = idea.state;

    if (state === "draft" && idea.draft) {
      var dr = idea.draft;
      if (st.body == null) st.body = dr.body || "";
      wrap.appendChild(h("div", { className: "small muted", text: "Claude wrote this " + fmtDT(idea.draftedAt) + " from your instruction: \"" + (idea.instruction || "") + "\"" }));
      wrap.appendChild(h("div", { className: "small", text: "To " + (dr.to || []).join(", ") + ((dr.cc && dr.cc.length) ? " · cc " + dr.cc.join(", ") : "") + (dr.subject ? " · " + dr.subject : "") }));
      var ta = h("textarea", { id: key + "-body", rows: "12", "aria-label": "Draft email", oninput: function (e) { st.body = e.target.value; } });
      ta.value = st.body;
      wrap.appendChild(ta);
      if (st.editing) wrap.appendChild(instructionEditor(key, st, idea.instruction, "Redraft with this", saveInstruction, function () { st.editing = false; render(); }));
      else wrap.appendChild(h("div", { className: "row" },
        h("button", { className: "btn primary", type: "button", onclick: function () { save({ state: "approved", approvedAt: now(), draft: Object.assign({}, dr, { body: st.body }) }); }, text: "Approve and send" }),
        h("button", { className: "btn", type: "button", onclick: function () { st.editing = true; st.instr = idea.instruction || ""; render(); }, text: "Change instructions" }),
        h("button", { className: "btn ghost", type: "button", onclick: function () { setIdea(id, null); }, text: "Discard" }),
        h("span", { className: "state", text: "Sends on the next check (" + nextCheck() + "), inside your send hours. Edits above are what gets sent." })));
    } else if (state === "approved") {
      wrap.appendChild(h("div", { className: "note ok-note", text: "Approved " + fmtDT(idea.approvedAt) + ". Claude sends it on the next check (" + nextCheck() + "), or right away if you say \"check Subdivide Finder\" in chat." }));
      if (idea.draft) { var did = key + "-sent"; var det = h("details", { className: "msg out", id: did, open: !!S.open[did], ontoggle: function () { S.open[did] = det.open; } }, h("summary", { className: "small", text: "Show the approved email" }), h("div", { className: "body", text: idea.draft.body || "" })); wrap.appendChild(det); }
      wrap.appendChild(h("div", { className: "row" }, h("button", { className: "btn sm", type: "button", onclick: function () { save({ state: "draft", approvedAt: null }); }, text: "Undo approval" })));
    } else if (state === "waiting") {
      wrap.appendChild(h("div", { className: "note", text: "Your instruction (" + fmtDT(idea.instructionAt) + "): \"" + idea.instruction + "\". Claude writes the draft on the next check (" + nextCheck() + "), or now if you say \"check Subdivide Finder\" in chat." }));
      if (st.editing) wrap.appendChild(instructionEditor(key, st, idea.instruction, "Save instruction", saveInstruction, function () { st.editing = false; render(); }));
      else wrap.appendChild(h("div", { className: "row" },
        h("button", { className: "btn sm", type: "button", onclick: function () { st.editing = true; st.instr = idea.instruction || ""; render(); }, text: "Edit" }),
        h("button", { className: "btn sm ghost", type: "button", onclick: function () { setIdea(id, null); }, text: "Cancel" })));
    } else {
      if (state === "held") wrap.appendChild(h("div", { className: "alert", style: "margin:0" }, h("p", { text: "Claude held this one: " + (idea.heldReason || "it needs more detail from you") + " Update the instruction below." })));
      if (state === "sent") wrap.appendChild(h("div", { className: "state ok", text: "Sent " + fmtDT(idea.sentAt) + ". Type a new instruction for the next email." }));
      if (state === "done") wrap.appendChild(h("div", { className: "row" }, h("span", { className: "state", text: "Marked no reply needed." }), h("button", { className: "btn sm ghost", type: "button", onclick: function () { setIdea(id, null); }, text: "Reopen" })));
      if (!st.instr && state === "held") st.instr = idea.instruction || "";
      var noEmail = kind === "first" && d && !(d.agent && d.agent.email);
      if (noEmail) wrap.appendChild(h("div", { className: "small muted", text: "No agent email on file. Claude looks it up before drafting, and uses the Redfin or Zillow request form if none exists." }));
      wrap.appendChild(instructionEditor(key, st, null, "Save instruction", saveInstruction, null,
        kind === "first" ? h("button", { className: "btn sm", type: "button", onclick: function () { saveInstruction(PRESETS.first); }, text: "Use the standard first email" }) : null,
        kind === "reply" && o && !inboundOf(o).length ? h("button", { className: "btn sm", type: "button", onclick: function () { saveInstruction(PRESETS.followup); }, text: "Send a follow-up" }) : null,
        kind === "reply" && state !== "done" ? h("button", { className: "btn sm ghost", type: "button", onclick: function () { setIdea(id, Object.assign({}, base, { state: "done", savedAt: now(), instruction: idea.instruction || "" })); }, text: "No reply needed" }) : null));
    }
    if (S.err[key]) wrap.appendChild(h("div", { className: "state err", text: S.err[key] }));
    return wrap;
  }
  function instructionEditor(key, st, prefill, btnText, onSave, onCancel) {
    var extras = Array.prototype.slice.call(arguments, 6).filter(Boolean);
    if (prefill != null && !st.instr) st.instr = prefill;
    var ta = h("textarea", { id: key + "-instr", rows: "3", "aria-label": "Instructions for Claude", placeholder: "Tell Claude what this email should say, e.g. \"Thank her for the survey, ask if the seller would take $140K and how soon they could close.\"", oninput: function (e) { st.instr = e.target.value; } });
    ta.value = st.instr || "";
    return h("div", { className: "compose" }, ta,
      h("div", { className: "row" },
        h("button", { className: "btn primary", type: "button", onclick: function () { onSave(st.instr); }, text: btnText }),
        onCancel ? h("button", { className: "btn ghost", type: "button", onclick: onCancel, text: "Cancel" }) : null,
        extras));
  }

  // Offer tracker
  function offerEditor(d) {
    var key = "offer-" + d.id;
    var o = d.offer || {};
    var st = S.local[key] || (S.local[key] = { amount: o.amount != null ? String(o.amount) : (d.offerHigh ? String(Math.round(d.offerHigh)) : ""), date: o.date || "", status: o.status || "Not submitted", counter: o.counter != null ? String(o.counter) : "", terms: o.terms || "" });
    var wrap = h("div", { className: "compose" }, h("div", { className: "lbl", text: "Offer" }),
      h("div", { className: "grid2" },
        h("label", { className: "f" }, "Offer amount ($)", h("input", { type: "number", id: key + "-amt", value: st.amount, oninput: function (e) { st.amount = e.target.value; st.dirty = 1; } })),
        h("label", { className: "f" }, "Date sent", h("input", { type: "date", id: key + "-date", value: st.date, oninput: function (e) { st.date = e.target.value; st.dirty = 1; } })),
        h("label", { className: "f" }, "Status", h("select", { id: key + "-status", onchange: function (e) { st.status = e.target.value; st.dirty = 1; } }, OFFER_STATUSES.map(function (s) { return h("option", { value: s, text: s, selected: st.status === s }); }))),
        h("label", { className: "f" }, "Their counter ($)", h("input", { type: "number", id: key + "-ctr", value: st.counter, oninput: function (e) { st.counter = e.target.value; st.dirty = 1; } }))),
      h("label", { className: "f" }, "Terms and notes", h("textarea", { id: key + "-terms", rows: "2", value: st.terms, oninput: function (e) { st.terms = e.target.value; st.dirty = 1; } })),
      h("div", { className: "row-actions" },
        h("button", { className: "btn primary", type: "button", onclick: function () { saveOffer(d, st, key); }, text: S.busy[key] ? "Saving…" : "Save offer" }),
        d.offerHigh ? h("span", { className: "state", text: "2x offer range " + money(d.offerLow) + " to " + money(d.offerHigh) + " · asking " + money(d.asking) }) : null,
        S.err[key] ? h("span", { className: "state err", text: S.err[key] }) : null));
    return wrap;
  }
  function saveOffer(d, st, key) {
    if (!S.db) return;
    var offer = { amount: st.amount === "" ? null : +st.amount, date: st.date || null, status: st.status, counter: st.counter === "" ? null : +st.counter, terms: st.terms || "", updatedAt: new Date().toISOString() };
    var patch = { offer: offer, col: null };
    if (st.status === "Submitted" || st.status === "Countered") patch.stage = "offer";
    if (st.status === "Accepted" || st.status === "Under contract") patch.stage = "contract";
    if (st.status === "Rejected" || st.status === "Withdrawn") patch.stage = d.stage === "offer" ? "talking" : (d.stage || "talking");
    S.busy[key] = true; S.err[key] = null; render();
    S.db.doc("deals/" + d.id).update(patch).then(function () { S.busy[key] = false; delete S.local[key]; render(); })
      .catch(function (e) { S.busy[key] = false; S.err[key] = "Couldn't save (" + ((e && e.code) || "error") + ")."; render(); });
  }

  function msgView(m) {
    if (isBounce(m.from)) return h("div", { className: "msg sys", text: "Delivery failed · " + fmtDT(m.date) + " · " + (m.snippet || "Gmail could not deliver this email.") });
    var out = isMe(m.from);
    var parts = splitQuoted(m.body);
    var head = h("div", { className: "msg-head" }, h("span", null, h("b", { text: out ? "You" : nameOf(m.from) }), out ? " to " + (m.to || []).join(", ") : " · " + emailOf(m.from)), h("span", { text: fmtDT(m.date) }));
    var inner = [h("div", { className: "body", text: parts[0] || m.snippet || "" })];
    if (parts[1]) { var qid = "q-" + m.id; var q = h("details", { className: "quoted", id: qid, open: !!S.open[qid], ontoggle: function () { S.open[qid] = q.open; } }, h("summary", { text: "Show quoted text" }), h("div", { className: "body", text: parts[1] })); inner.push(q); }
    if (m.attachments && m.attachments.length) inner.push(h("div", { className: "small muted", text: "Attachments: " + m.attachments.join(", ") }));
    if (out) { var did = "m-" + m.id; var d = h("details", { className: "msg out", id: did, open: !!S.open[did], ontoggle: function () { S.open[did] = d.open; } }, h("summary", null, head), inner); return d; }
    return h("div", { className: "msg in" }, head, inner);
  }

  setInterval(render, 60000);

  // ---------- boot ----------
  S.route = parseRoute();
  window.addEventListener("hashchange", function () { var prev = S.route.search, prevPage = S.route.page; S.route = parseRoute(); if (prev !== S.route.search || prevPage !== S.route.page) { S.q = ""; window.scrollTo(0, 0); } render(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.route.deal) go(S.route.search); });
  render();
  if (!window.claude || typeof window.claude.use !== "function") { S.dbState = "none"; render(); return; }
  var timer = null;
  var loaded = { runs: 0, deals: 0, outreach: 0 };
  function markLoaded(k, snap) {
    if (!snap.metadata.fromCache) loaded[k] = 1;
    if (loaded.runs && loaded.deals && loaded.outreach) { clearTimeout(timer); if (!S.toldOpener && window.opener) { S.toldOpener = true; try { window.opener.postMessage({ type: "sf-ready" }, "https://mail.google.com"); } catch (e) {} } }
    if (S.dbState === "loading") S.dbState = "ready";
  }
  function docs(snap) { return snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; }); }
  window.claude.use("db").then(function (db) {
    if (!db) { clearTimeout(timer); S.dbState = "none"; render(); return; }
    S.db = db;
    timer = setTimeout(function () { if (S.dbState === "loading") { S.dbState = "error"; S.dbError = "the data store didn't answer"; render(); } }, 15000);
    var fail = function (e) { clearTimeout(timer); S.dbState = "error"; S.dbError = e && e.code; render(); };
    db.collection("runs").onSnapshot(function (snap) { S.runs = docs(snap); markLoaded("runs", snap); render(); }, fail);
    db.collection("deals").onSnapshot(function (snap) { S.deals = docs(snap); markLoaded("deals", snap); render(); }, fail);
    db.collection("settings").onSnapshot(function (snap) { var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); }); S.settings = m; S.settingsErr = null; render(); }, function (e) { S.settingsErr = (e && e.code) || "error"; render(); });
    db.collection("ideas").onSnapshot(function (snap) { var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); }); S.ideas = m; render(); }, function () {});
    db.collection("outreach").onSnapshot(function (snap) {
      S.outreach = docs(snap).map(function (x) { if (!x.threadId) x.threadId = x.id; return x; });
      markLoaded("outreach", snap); render();
    }, fail);
  }).catch(function () { clearTimeout(timer); S.dbState = "none"; render(); });
})();
</script>
