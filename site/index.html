<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subdivide Finder · Utopian Capital</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="sf-adapter.js"></script>
<script src="counties.js"></script>
<style>
:root{
  --bg:#F8F5EF; --surface:#FFFFFF; --surface-2:#F1EDE3;
  --ink:#1A1918; --ink-2:#4A4642; --ink-3:#857F76;
  --border:#E5DFD1; --border-strong:#C9C0AC;
  --accent:#2E5D3A; --accent-ink:#FAFBF8; --accent-soft:#E4EEDF;
  --gold:#C69B4F; --gold-soft:#F5EBD6; --gold-ink:#6B4A0E;
  --danger:#B8422E; --danger-soft:#FBE9E4;
  --info-soft:#E4EBF3; --info-ink:#1F3C5C;
  --warn-soft:#F7ECD0; --warn-ink:#6B4A0E;
  --success-soft:#DEEDD8; --success-ink:#285B18;
  --purple-soft:#E7E4F1; --purple-ink:#38315C;
  --shadow-sm:0 1px 2px rgba(20,17,10,.04); --shadow-md:0 4px 16px rgba(20,17,10,.06); --shadow-lg:0 12px 40px rgba(20,17,10,.12);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .small{font-size:12.5px}

/* top bar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand img{height:40px;width:auto;display:block}
.brand .sep{width:1px;height:26px;background:var(--border)}
.brand .name{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.top-right a{color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--ink);transition:all .15s var(--ease);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:#254A2E;border-color:#254A2E}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.scard:focus-visible,.dcard:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* page */
.page{max-width:1320px;margin:0 auto;padding:28px 24px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.02em;line-height:1.15}
.page-head p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);text-decoration:none;font-size:13px;margin-bottom:10px}
.crumb:hover{color:var(--ink)}
h2.sec{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:32px 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec .muted{font-family:var(--sans);font-size:13px;font-weight:500}
.empty{padding:36px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-lg)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--pb,var(--surface-2));color:var(--pc,var(--ink-2));white-space:nowrap}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* alert strip */
.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-lg);background:var(--danger-soft);color:var(--danger);font-weight:500;margin-bottom:18px;flex-wrap:wrap}
.alert.info{background:var(--info-soft);color:var(--info-ink)}
.alert p{flex:1;min-width:220px}

/* searches grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 18px 16px;box-shadow:var(--shadow-sm);text-align:left;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s var(--ease),transform .15s var(--ease),border-color .15s var(--ease);width:100%}
.scard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--border-strong)}
.scard .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.scard h3{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:-.01em;line-height:1.25}
.scard .sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
.funnel{display:flex;align-items:baseline;gap:8px;color:var(--ink-2);font-size:13px}
.funnel b{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--ink)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend b{font-weight:600;color:var(--ink)}

/* new search form */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm)}
.form-grid{display:grid;grid-template-columns:120px 140px 1fr;gap:12px}
label.f,div.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);font-size:13.5px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state{font-size:12.5px;color:var(--ink-3)}
.state.err{color:var(--danger)} .state.ok{color:var(--success-ink)}

/* summary */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat .l{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.02em;margin-top:2px;line-height:1.2}
.stat .s{font-size:12px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;margin-top:12px}
.panel h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:12px}
.hbar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.hbar .track{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.hbar .track span{display:block;height:100%;border-radius:999px}
.hbar .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:0 8px 8px;border-bottom:1px solid var(--border)}
table.t td{padding:8px;border-bottom:1px solid var(--border)}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
.foot{margin-top:10px;font-size:12px;color:var(--ink-3)}

/* pipeline board */
.board-bar{display:flex;gap:10px;align-items:center;margin:32px 0 12px;flex-wrap:wrap}
.board-bar h2.sec{margin:0}
.board-bar input{max-width:280px;margin-left:auto}
.board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.col-head i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.col-head b{font-size:13px;font-weight:600}
.col-head .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--surface);border-radius:999px;padding:0 8px}
.col-hint{font-size:11.5px;color:var(--ink-3);padding:0 4px 4px;line-height:1.4}
.col-empty{font-size:12px;color:var(--ink-3);text-align:center;padding:14px 6px;border:1px dashed var(--border-strong);border-radius:var(--r-md)}
.dcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cc,var(--border-strong));border-radius:var(--r-md);padding:10px 11px;text-align:left;width:100%;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow-sm);transition:box-shadow .15s var(--ease),transform .15s var(--ease)}
.dcard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.dcard.sel{outline:2px solid var(--accent);outline-offset:1px}
.dcard .a{font-weight:600;font-size:13px;line-height:1.3}
.dcard .m{font-size:12px;color:var(--ink-3)}
.dcard .o{font-size:12px;color:var(--ink-2)}
.dcard .tags{display:flex;gap:4px;flex-wrap:wrap}
.dcard .tags .pill{white-space:normal}
details.aside{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
details.aside>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details.aside>summary::before{content:"▸";color:var(--ink-3);transition:transform .15s}
details.aside[open]>summary::before{transform:rotate(90deg)}
.alist{padding:0 8px 8px}
.arow{display:grid;grid-template-columns:minmax(0,1.4fr) 110px minmax(0,2fr);gap:12px;align-items:center;padding:8px;border-top:1px solid var(--border);text-align:left;width:100%;font-size:13px}
.arow:hover{background:var(--surface-2)}
.arow .why{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(26,25,24,.28);z-index:50;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--bg);z-index:51;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slide .2s var(--ease)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{animation:none}.scard,.dcard{transition:none}}
.dr-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;z-index:2}
.dr-head .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:var(--r-sm);font-size:20px;color:var(--ink-3)}
.dr-head .x:hover{background:var(--surface-2);color:var(--ink)}
.dr-head h2{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.01em;padding-right:36px;line-height:1.25}
.dr-head .m{color:var(--ink-3);font-size:12.5px;margin-top:4px}
.dr-head .row{margin-top:10px}
.dr-body{padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px}
.box>.lbl,.lbl{font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:block}
.note{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;font-size:13px;color:var(--ink-2)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.fig .k{display:block;font-size:11.5px;color:var(--ink-3)}
.fig .v{display:block;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.compose{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prep{display:flex;flex-direction:column;margin-top:8px}
.prep-row{display:grid;grid-template-columns:170px 112px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--border);font-size:13px}
.prep-row:first-child{border-top:0}
.prep-row .pt{font-weight:600}
.prep-row .pv{color:var(--ink-2);min-width:0}
.prep-row.edit{grid-template-columns:170px 1fr}
.prep-row .pe{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prep-row .pe input{flex:1;min-width:160px}
.prep-later{margin-top:8px}
.calc-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;align-items:end;margin-top:10px}
.calc-in label.f input{min-width:0}
.calc-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 10px}
.calc-sum>div{background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.calc-sum span{font-size:11.5px;color:var(--ink-3)}
.calc-sum b{font-size:15px;font-variant-numeric:tabular-nums}
.calc-sum small{font-size:11.5px;color:var(--ink-2)}
.calc-wrap{overflow-x:auto}
.calc-t{font-size:12.5px;width:100%}
.calc-t td,.calc-t th{font-variant-numeric:tabular-nums;vertical-align:top;padding:7px 6px}
.calc-t th{padding:0 6px 6px;letter-spacing:.02em}
.calc-t .sub{font-size:11px;color:var(--ink-3);font-weight:400}
.calc-t .sub.neg{color:var(--danger)}
.calc-t td.r,.calc-t th.r{text-align:right}
.calc-t tr.best td{background:var(--success-soft)}
.neg{color:var(--danger)}
@media (max-width:640px){.calc-in{grid-template-columns:repeat(2,minmax(0,1fr))}.calc-sum{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--danger)}
.chip.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.prep-later>summary{cursor:pointer;font-size:12.5px;color:var(--ink-3);padding:4px 0}
@media (max-width:640px){.prep-row{grid-template-columns:1fr auto}.prep-row .pv{grid-column:1/-1}.prep-row.edit{grid-template-columns:1fr}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-md);background:var(--warn-soft);color:var(--warn-ink);font-size:13px}
.convo{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;background:var(--surface)}
.msg.in{background:var(--accent-soft);border-color:#CFE0C8}
.msg.out>summary{cursor:pointer;list-style:none}
.msg.sys{background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.msg-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.msg-head b{color:var(--ink)}
.by-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.by-tags .pill{white-space:normal;overflow-wrap:anywhere}
.stage-row{margin-top:12px}
.stage-row select{width:100%}
.stage-next{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.uw-list{margin:4px 0 10px;padding-left:20px;font-size:13px}
.uw-list li{margin:2px 0;color:var(--ink-2)}
.uw-list li.done{color:var(--success-ink)}
.uw-list li.done::marker{content:'\2713  '}
.msg.in.unread{border-color:var(--danger);box-shadow:inset 3px 0 0 var(--danger)}
.readbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.newtag{display:inline-block;background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:600;margin-left:6px}
.inbox-btn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);font-size:12.5px;cursor:pointer}
.inbox-btn.has{border-color:var(--danger);color:var(--danger);font-weight:600}
.inbox-panel .irow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--border)}
.inbox-panel .irow:first-of-type{border-top:0}
.inbox-panel .snip{font-size:12.5px;color:var(--ink-2);grid-column:1/-1;white-space:pre-wrap;overflow-wrap:anywhere;max-height:4.5em;overflow:hidden}
.msg .body{white-space:pre-wrap;font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.quoted summary{cursor:pointer;font-size:12px;color:var(--ink-3);margin-top:6px}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;align-items:center}
.tsep{height:1px;background:var(--border);margin:6px 0}

/* nav tabs */
.tabs{display:flex;gap:2px;margin-left:8px}
.tabs a{padding:8px 12px;border-radius:var(--r-md);color:var(--ink-2);font-size:13.5px;font-weight:500;text-decoration:none;height:36px;display:flex;align-items:center}
.tabs a:hover{background:var(--surface-2);color:var(--ink)}
.tabs a[aria-current=page]{background:var(--ink);color:var(--surface)}
/* criteria */
.crit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.unit-wrap{display:flex;align-items:center;gap:6px}
.unit-wrap input{flex:1;min-width:0}
.unit{font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.help{font-size:11.5px;font-weight:400;color:var(--ink-3);line-height:1.35}
label.crit.changed input,label.crit.changed select{border-color:var(--gold);background:var(--gold-soft)}
label.crit.changed .help{color:var(--gold-ink);font-weight:600}
.crit-toggles{display:flex;flex-direction:column;gap:6px;margin-top:12px}
label.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
label.check.changed{color:var(--gold-ink);font-weight:600}
.panel h3+.crit-grid{margin-top:0}
.def{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--ink-2)}
.def:last-child{border-bottom:0}
ol.steps,ul.steps{padding-left:36px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink-2)}
.crit-line{font-size:12.5px;color:var(--ink-2);margin:-8px 0 0;max-width:110ch}
.crit-line .chg{color:var(--gold-ink);font-weight:600}
/* county picker */
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px;max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-md);padding:6px;background:var(--bg)}
.citem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);font-size:13px;cursor:pointer;background:var(--surface);border:1px solid transparent}
.citem:hover{border-color:var(--border-strong)}
.citem.on{border-color:var(--accent);background:var(--accent-soft)}
.citem .cn{flex:1;font-weight:500}
.citem .cl{font-size:11px;color:var(--ink-3)}
.crit-box{margin-top:14px;border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;background:var(--bg)}
.crit-toggle{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;font-size:13px;flex-wrap:wrap}
/* land portal map */
.dr-map{background:var(--surface);border-bottom:1px solid var(--border)}
.dr-map iframe{display:block;width:100%;height:360px;border:0;background:#0e2f33}
.map-foot{padding:8px 20px;justify-content:space-between}
@media (max-width:640px){.dr-map iframe{height:280px}.def{grid-template-columns:1fr}}

.board{grid-template-columns:repeat(8,minmax(160px,1fr))!important}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.dcard[draggable=true]{cursor:grab}
.dcard.dragging{opacity:.45}
details.aside.drop>summary{background:var(--accent-soft)}
.note.ok-note{background:var(--success-soft);color:var(--success-ink)}
.lp-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--border)}
.frow:first-of-type{border-top:0}
.fname{text-align:left;font-weight:600;font-size:13px;color:var(--accent);text-decoration:underline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{white-space:nowrap}
input[type=file]{font-size:12.5px;max-width:100%}
@media (max-width:640px){.frow{grid-template-columns:auto 1fr auto}.fmeta{display:none}}
/* sign-in gate */
#sf-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#sf-gate form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-lg)}
#sf-gate img{height:42px;width:auto;align-self:flex-start}
#sf-gate h1{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:-.01em}

@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:640px){.page{padding:20px 14px 60px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid,.grid2,.figs{grid-template-columns:1fr 1fr}.sgrid{grid-template-columns:1fr}.arow{grid-template-columns:1fr}.topbar{padding:10px 14px}.brand img{height:28px}}
</style>
</head>
<body>
<div id="sf-gate" hidden>
  <form id="sf-gate-form">
    <img src="logo.png" alt="Utopian Capital">
    <h1>Subdivide Finder</h1>
    <p class="muted small">Sign in with your Utopian CRM account.</p>
    <label class="f">Email<input type="email" id="sf-email" autocomplete="username" required></label>
    <label class="f">Password<input type="password" id="sf-pass" autocomplete="current-password" placeholder="Leave blank to get an email link"></label>
    <button class="btn primary" type="submit" style="justify-content:center">Sign in</button>
    <p class="small muted" id="sf-gate-msg"></p>
  </form>
</div>
<header class="topbar">
  <a class="brand" href="#/" aria-label="Subdivide Finder home"><img src="logo.png" alt="Utopian Capital"><span class="sep"></span><span class="name">Subdivide Finder</span></a>
  <nav class="tabs" id="tabs" aria-label="Sections"><a href="#/" id="tab-searches">Searches</a><a href="#/criteria" id="tab-criteria">Criteria</a></nav>
  <div class="top-right"><button type="button" class="inbox-btn" id="inbox-btn" hidden aria-label="Agent emails to read"></button><span id="fresh"></span><span id="sf-who"></span><a href="#" id="sf-signout">Sign out</a></div>
</header>
<main class="page" id="view"></main>
<div id="drawer-slot"></div>
<script>
(function () {
  "use strict";
  var ME = "jay@utopiancapitalinvest.com";
  var TZ = "America/Chicago";
  var GMAIL = "Gmail";
  var PHONE = "(336) 962-2411";

  var STATES = "AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");
  var SCREENS = [
    { id: "Ready to offer", c: "var(--good)" },
    { id: "Verify with agent", c: "var(--claude)" },
    { id: "Need APN", c: "var(--due)" },
    { id: "Frontage short", c: "var(--wait)" },
    { id: "Steep", c: "var(--wait)" },
    { id: "Fail", c: "var(--bad)" }
  ];
  var SCOLOR = {}; SCREENS.forEach(function (s) { SCOLOR[s.id] = s.c; });
  var STAGES = [
    { id: "new", label: "New" }, { id: "contacting", label: "Contacting agent" }, { id: "talking", label: "In talks" }, { id: "review", label: "Ready for review" }, { id: "underwriting", label: "Approved for underwriting" },
    { id: "offerready", label: "Offer ready" }, { id: "offer", label: "Offer made" }, { id: "contract", label: "Under contract" }, { id: "dead", label: "Dead" }
  ];
  var BUCKETS = [
    { id: "needs", short: "Reply needed" }, { id: "held", short: "Claude has a question" }, { id: "draft", short: "Draft ready" },
    { id: "approved", short: "Approved, sending soon" }, { id: "waiting", short: "Claude drafting" }, { id: "followup", short: "Follow-up due" },
    { id: "awaiting", short: "Waiting on the agent" }, { id: "undelivered", short: "Not delivered" }, { id: "done", short: "Done" }
  ];
  var BMAP = {}; BUCKETS.forEach(function (b) { BMAP[b.id] = b; });

  var TEMPLATE = [
    "Good [morning/afternoon] [Agent first name],",
    "",
    "I'm looking at your listing at [Property Address] and we're very interested in it. We're a serious buyer and actively buying land in and around [County] County. I wanted to reach out and learn a little more about the tract.",
    "",
    "How is the access to the property? Is there public road frontage, or does it come in off a private drive? If there is public road frontage, how many feet is there? Are you aware of any easements on the tract for access?",
    "",
    "Do you have the parcel number or APN, so we can pull it up on the county GIS map? If there's a survey available, could you send that over as well?",
    "",
    "Do you know what utilities are available out there, or whether they would have to be extended to the property? And are there any perc sites present on the property?",
    "",
    "If you have any additional pictures or videos of the tract, please send them my way!",
    "",
    "Feel free to shoot me a text or give me a call at my work number, " + PHONE + ". I look forward to hearing from you!",
    "",
    "Thank you,",
    "Jay"
  ].join("\n");

  var S = {
    db: null, mcp: null, sample: null, dbState: "loading", dbError: null,
    runs: [], deals: [], outreach: [], ideas: {},
    threads: {}, extras: {}, watching: {}, searchWatch: null, searchKey: null,
    gmail: { lastAt: null, error: null },
    route: { search: null, deal: null, page: "searches" }, showNew: false, settings: {}, settingsErr: null, crm: {}, q: "", all: [], lastDrawer: null,
    open: {}, local: {}, busy: {}, err: {}, confirm: {}, composeOpen: {}
  };

  // ---------- helpers ----------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k === "className") el.className = v;
      else if (k === "value") el.value = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  function emailOf(s) { if (!s) return ""; var m = String(s).match(/<([^>]+)>/); return (m ? m[1] : String(s)).trim().toLowerCase(); }
  function nameOf(s) { var m = String(s || "").match(/^\s*"?([^"<]+?)"?\s*</); return m ? m[1] : emailOf(s); }
  function isMe(s) { return emailOf(s) === ME; }
  function isBounce(s) { return /mailer-daemon|postmaster/i.test(String(s || "")); }
  function firstName(n) { return String(n || "").trim().split(/[\s\/]+/)[0] || "there"; }
  function fmtDT(iso) { if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return ""; return d.toLocaleString("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function fmtDay(ymd) { if (!ymd) return ""; var d = new Date(ymd + "T12:00:00Z"); return isNaN(d) ? ymd : d.toLocaleDateString("en-US", { timeZone: "UTC", month: "short", day: "numeric" }); }
  function todayCT() { return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
  function ctParts() {
    var p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", hour12: false, weekday: "short" }).formatToParts(new Date());
    var o = {}; p.forEach(function (x) { o[x.type] = x.value; }); return { hour: (+o.hour) % 24, wd: o.weekday };
  }
  function offHours() { var p = ctParts(), o = outreachRules(); return p.hour >= (+o.sendCutoff || 19) || p.hour < 7 || (o.noWeekends !== false && (p.wd === "Sat" || p.wd === "Sun")); }
  function greeting() { return ctParts().hour < 12 ? "Good morning" : "Good afternoon"; }
  function addBizDays(n) {
    var d = new Date(todayCT() + "T12:00:00Z"), k = 0;
    while (k < n) { d.setUTCDate(d.getUTCDate() + 1); var w = d.getUTCDay(); if (w !== 0 && w !== 6) k++; }
    return d.toISOString().slice(0, 10);
  }
  function ago(ms) { var s = Math.max(0, Math.round((Date.now() - ms) / 1000)); if (s < 60) return "just now"; var m = Math.round(s / 60); if (m < 60) return m + " min ago"; var hr = Math.round(m / 60); if (hr < 24) return hr + " hr ago"; return Math.round(hr / 24) + " days ago"; }
  function money(n) { return n == null || n === "" || isNaN(+n) ? "" : "$" + Math.round(+n).toLocaleString("en-US"); }
  function pct(n) { return n == null || isNaN(+n) ? "" : (Math.round(+n * 1000) / 10) + "%"; }
  function splitQuoted(t) {
    t = String(t || "").replace(/\r\n/g, "\n");
    var re = /(^|\n)[ \t>]*(On [\s\S]{0,300}?wrote:|-{2,}\s*Original Message\s*-{2,}|From: [^\n]+\n(?:Sent|Date): )/i;
    var m = re.exec(t);
    if (m && m.index > 10) return [t.slice(0, m.index).trim(), t.slice(m.index).trim()];
    return [t.trim(), ""];
  }
  // ---------- derived ----------
  function convoFor(o) {
    var list = (o.messages || []).map(function (m) {
      var body = m.body != null ? m.body : (m.first ? (o.sentBody || "") : "");
      return { id: m.id, from: m.fromName ? m.fromName + " <" + m.from + ">" : m.from, to: m.to || (m.dir === "out" ? (o.to || []) : [ME]), date: m.date, t: Date.parse(m.date) || 0, body: body, snippet: "", attachments: m.attachments || [], viewUrl: m.viewUrl };
    });
    var seen = {};
    list = list.filter(function (m) { if (seen[m.id]) return false; seen[m.id] = 1; return true; });
    list.sort(function (a, b) { return (a.t || 0) - (b.t || 0); });
    return list;
  }
  function inboundOf(o) { return convoFor(o).filter(function (m) { return !isMe(m.from) && !isBounce(m.from); }); }
  // ---------- read receipts: every agent email stays "unread" until Jay clicks Mark read (stored on sf_outreach doc.reads) ----------
  function readOf(o, m) { return (o.reads || {})[m.id] || null; }
  function unreadList() {
    var out = [];
    S.outreach.forEach(function (o) { inboundOf(o).forEach(function (m) { if (!readOf(o, m)) out.push({ o: o, m: m }); }); });
    return out.sort(function (a, b) { return (b.m.t || 0) - (a.m.t || 0); });
  }
  function unreadForDeal(d) { var n = 0; outreachForDeal(d).forEach(function (o) { inboundOf(o).forEach(function (m) { if (!readOf(o, m)) n++; }); }); return n; }
  function markRead(o, ids) {
    if (!S.db || !ids.length) return;
    var at = new Date().toISOString(), by = S.me || ME, reads = Object.assign({}, o.reads || {});
    ids.forEach(function (id) { if (!reads[id]) reads[id] = { at: at, by: by }; });
    o.reads = reads; render();
    S.db.doc("outreach/" + o.id).update({ reads: reads }).catch(function (e) { S.err["read-" + o.id] = "Couldn't save read status (" + ((e && e.code) || "error") + ")."; render(); });
  }
  function markAllRead() {
    var by = {}; unreadList().forEach(function (x) { (by[x.o.id] = by[x.o.id] || { o: x.o, ids: [] }).ids.push(x.m.id); });
    Object.keys(by).forEach(function (k) { markRead(by[k].o, by[k].ids); });
  }
  function dealForOutreach(o) { return (o.dealId && dealById(o.dealId)) || null; }
  function openUnread(x) {
    var d = dealForOutreach(x.o); S.showInbox = false;
    if (d && d.runId) { S.open["unread-jump"] = x.m.id; go(d.runId, d.id); } else render();
  }
  function inboxPanel() {
    var list = unreadList();
    var p = h("div", { className: "panel inbox-panel", style: "margin-bottom:18px" },
      h("div", { className: "row", style: "justify-content:space-between;margin-bottom:6px" },
        h("b", { text: list.length ? list.length + (list.length === 1 ? " agent email to read" : " agent emails to read") : "All agent emails read" }),
        h("span", { className: "row", style: "gap:6px" },
          list.length > 1 ? h("button", { className: "btn sm ghost", type: "button", onclick: markAllRead, text: "Mark all read" }) : null,
          h("button", { className: "btn sm ghost", type: "button", onclick: function () { S.showInbox = false; render(); }, text: "Close" }))));
    list.forEach(function (x) {
      var d = dealForOutreach(x.o);
      p.appendChild(h("div", { className: "irow" },
        h("div", null, h("b", { text: (d && d.address) || x.o.property || x.o.subject || "Email" }), h("div", { className: "small muted", text: nameOf(x.m.from) + " · " + fmtDT(x.m.date) + ((x.m.attachments && x.m.attachments.length) ? " · " + x.m.attachments.length + " attachment" + (x.m.attachments.length === 1 ? "" : "s") : "") })),
        h("span", { className: "row", style: "gap:6px;align-items:flex-start" },
          d ? h("button", { className: "btn sm", type: "button", onclick: function () { openUnread(x); }, text: "Open" }) : null,
          h("button", { className: "btn sm primary", type: "button", onclick: function () { markRead(x.o, [x.m.id]); }, text: "Mark read" })),
        h("div", { className: "snip", text: splitQuoted(x.m.body)[0] || "" })));
    });
    return p;
  }
  function bucketFor(o) {
    var idea = S.ideas[o.threadId] || {};
    var msgs = convoFor(o);
    var inbound = msgs.filter(function (m) { return !isMe(m.from) && !isBounce(m.from); });
    var lastIn = inbound.length ? inbound[inbound.length - 1].t : 0;
    var outs = msgs.filter(function (m) { return isMe(m.from); });
    var lastOut = Math.max(outs.length ? outs[outs.length - 1].t : 0, Date.parse(idea.sentAt) || 0, Date.parse(o.sentAt) || 0);
    if (idea.state === "done" && (Date.parse(idea.savedAt) || 0) >= lastIn) return "done";
    if (idea.state === "held" || idea.state === "draft" || idea.state === "approved" || idea.state === "waiting") return idea.state;
    if (lastIn && lastIn > lastOut) return "needs";
    if (o.delivery === "bounced" && !inbound.length) return "undelivered";
    var due = idea.followUpDue || o.followUpDue;
    if (!inbound.length && due && todayCT() >= due) return "followup";
    return "awaiting";
  }
  function dealById(id) { var a = S.all.length ? S.all : S.deals; for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
  function outreachForDeal(d) { return S.outreach.filter(function (o) { return o.dealId === d.id || (d._tid && o.threadId === d._tid); }).sort(function (a, b) { return String(a.sentAt).localeCompare(String(b.sentAt)); }); }
  function runLabel(r) {
    if (!r) return "";
    if (r.label) return r.label;
    var c = (r.counties || []);
    var names = r.allApproved ? "all CRM-approved counties" : c.join(", ");
    return (r.state || "") + ": " + names;
  }
  function runsSorted() { return S.runs.slice().sort(function (a, b) { return String(b.requestedAt || "").localeCompare(String(a.requestedAt || "")); }); }

  // ---------- render ----------
  var pending = false;
  function editing() {
    var a = document.activeElement;
    if (!a || a.id === "board-q") return false;
    return a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox" && a.type !== "radio" && a.type !== "file");
  }
  function render() {
    if (S.dragging) { S.renderAfterDrag = true; return; }
    if (S.pointerDown || editing()) { S.renderLater = true; return; } // don't rebuild the page under the cursor or caret
    if (pending) return; pending = true; requestAnimationFrame(function () { pending = false; draw(); });
  }
  function flushLater() { if (S.renderLater && !S.pointerDown && !editing()) { S.renderLater = false; render(); } }
  document.addEventListener("pointerdown", function () { S.pointerDown = true; }, true);
  document.addEventListener("pointerup", function () { setTimeout(function () { S.pointerDown = false; flushLater(); }, 0); }, true);
  document.addEventListener("pointercancel", function () { S.pointerDown = false; flushLater(); }, true);
  document.addEventListener("focusout", function () { setTimeout(flushLater, 0); }, true);

  // ---------- pipeline model ----------
  var COLS = [
    { id: "rejected", label: "Rejected", hint: "Failed a screen, went dead, or you passed. Drag one back out anytime.", dot: "#B8422E", pb: "var(--danger-soft)", pc: "var(--danger)", stage: "rejected" },
    { id: "contact", label: "Contact agent", hint: "Acreage or frontage still needs confirming. Claude is on it.", dot: "#C69B4F", pb: "var(--gold-soft)", pc: "var(--gold-ink)", stage: "new" },
    { id: "contacted", label: "Agent contacted", hint: "Emailing the agent: waiting on a reply or going back and forth. Claude confirms acreage and frontage.", dot: "#4F79A8", pb: "var(--info-soft)", pc: "var(--info-ink)", stage: "contacting" },
    { id: "review", label: "Ready for review", hint: "Acreage and frontage are in. Quick look: approve for underwriting or reject.", dot: "#2F7F86", pb: "#E0EFEF", pc: "#1D4E52", stage: "review" },
    { id: "underwriting", label: "Approved for underwriting", hint: "Claude gathers access, utilities, septic, restrictions and flood. You run the numbers and set the offer in Your review.", dot: "#7A6BB8", pb: "var(--purple-soft)", pc: "var(--purple-ink)", stage: "underwriting" },
    { id: "offerready", label: "Offer ready", hint: "Underwriting done and the offer is set. Have Claude draft the offer email to the agent.", dot: "#3E9B2F", pb: "var(--success-soft)", pc: "var(--success-ink)", stage: "offerready" },
    { id: "offer", label: "Offer made", hint: "The offer went to the agent. Waiting on the seller's answer.", dot: "#C2762B", pb: "var(--warn-soft)", pc: "var(--warn-ink)", stage: "offer" },
    { id: "contract", label: "Under contract", hint: "Accepted. Drag here when it goes under contract.", dot: "#2E5D3A", pb: "var(--accent-soft)", pc: "var(--accent)", stage: "contract" }
  ];
  var CMAP = {}; COLS.forEach(function (c) { CMAP[c.id] = c; });
  CMAP.ready = CMAP.review; CMAP.aside = CMAP.rejected; CMAP.talking = CMAP.contacted; CMAP.approved = CMAP.underwriting; // older saved column ids
  var SCREEN_DOT = { "Ready to offer": "#4C8B3A", "Verify with agent": "#4F79A8", "Need APN": "#C69B4F", "Frontage short": "#B9B1A1", "Steep": "#A89F8E", "Fail": "#B8422E" };

  function runById(id) { for (var i = 0; i < S.runs.length; i++) if (S.runs[i].id === id) return S.runs[i]; return null; }
  function buildAll() {
    var known = {}; S.deals.forEach(function (d) { known[d.id] = 1; });
    var orphans = [];
    S.outreach.forEach(function (o) {
      if (o.dealId && known[o.dealId]) return;
      orphans.push({ id: "o-" + o.threadId, _orphan: true, _tid: o.threadId, runId: o.runId || o.search, county: o.county, state: "", address: o.property, acres: o.acres, asking: o.asking,
        agent: { name: o.agent, brokerage: o.brokerage, phone: o.phone, email: (o.to || [])[0] }, links: o.links || {}, screen: "Verify with agent" });
    });
    S.all = S.deals.concat(orphans);
  }
  function dealsForRun(r) { return S.all.filter(function (d) { return d.runId === r.id; }); }
  function colFor(d) {
    if (d.col && CMAP[d.col]) return CMAP[d.col].id;
    var os = d.offer && d.offer.status;
    if (os === "Accepted" || os === "Under contract" || d.stage === "contract") return "contract";
    if (os === "Submitted" || os === "Countered" || d.stage === "offer") return "offer";
    if (d.stage === "rejected" || d.stage === "dead") return "rejected";
    if (d.stage === "offerready") return "offerready";
    if (d.stage === "underwriting" || d.stage === "approved") return "underwriting";
    if (d.stage === "review" || d.stage === "ready") return "review";
    if (d.screen === "Ready to offer" && (!d.stage || d.stage === "new")) return "review";
    var th = outreachForDeal(d);
    if (th.length || d.stage === "talking" || d.stage === "contacting") return "contacted";
    if (d.screen === "Ready to offer" || d.screen === "Verify with agent" || d.screen === "Need APN") return "contact";
    return "rejected";
  }
  var FLAGS = {

      S.outreach = docs(snap).map(function (x) { if (!x.threadId) x.threadId = x.id; return x; });
      markLoaded("outreach", snap); render();
    }, fail);
  }).catch(function () { clearTimeout(timer); S.dbState = "none"; render(); });
})();
</script>
