<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subdivide Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="sf-adapter.js"></script>
<style>
/* Layout idea: a field-office console. KPI strip on top, four tabs (Deals, Inbox, Offers, Counties), one working column of cards. */
:root {
  --bg: #f2f5f2;
  --surface: #ffffff;
  --ink: #18221d;
  --muted: #5b6a61;
  --line: #d9e1db;
  --accent: #2f5d46;
  --accent-ink: #ffffff;
  --soft: #e8efe9;
  --needs: #c2410c;
  --claude: #2a5fa6;
  --good: #23794a;
  --due: #a86a0a;
  --wait: #75827b;
  --bad: #b42318;
  --done: #9aa69f;
  --in-bg: #f6f8f6;
  --out-bg: #eef4f0;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #192019; --ink: #e6ece7; --muted: #9aa8a0; --line: #2b352e;
    --accent: #6fb08c; --accent-ink: #0d1510; --soft: #1f2a23;
    --needs: #f08a4b; --claude: #7aa7e6; --good: #5cc48a; --due: #e0a948; --wait: #8d9a93; --bad: #f2776b; --done: #6b776f;
    --in-bg: #1d251f; --out-bg: #1a2a20; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #192019; --ink: #e6ece7; --muted: #9aa8a0; --line: #2b352e;
  --accent: #6fb08c; --accent-ink: #0d1510; --soft: #1f2a23;
  --needs: #f08a4b; --claude: #7aa7e6; --good: #5cc48a; --due: #e0a948; --wait: #8d9a93; --bad: #f2776b; --done: #6b776f;
  --in-bg: #1d251f; --out-bg: #1a2a20; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 18px 16px 72px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
h3 { font-size: 16.5px; font-weight: 700; }
a { color: var(--accent); }
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: end; justify-content: space-between; }
.fresh { color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 2px; text-align: left; cursor: pointer; }
.kpi:hover { border-color: var(--accent); }
.kpi .v { font-family: var(--font-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--c, var(--ink)); }
.kpi .l { font-size: 13px; color: var(--muted); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: none; border-bottom: 3px solid transparent; padding: 9px 14px; font-weight: 700; cursor: pointer; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--needs); color: #fff; font-size: 12px; text-align: center; }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.warn { border-color: var(--due); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
input[type="text"], input[type="number"], input[type="date"], input[type="email"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
textarea { width: 100%; resize: vertical; line-height: 1.45; background: var(--bg); }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
label.f > input, label.f > select, label.f > textarea { font-weight: 400; color: var(--ink); }

.banner { border: 1px solid var(--line); border-left: 4px solid var(--due); background: var(--surface); border-radius: 10px; padding: 11px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.banner.bad { border-left-color: var(--bad); }
.banner p { margin: 0; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px 5px 9px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--wait)); }
.chip .n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); box-shadow: inset 0 0 0 1px var(--c, var(--accent)); }
.chip.zero { opacity: .5; }
.how { color: var(--muted); font-size: 14px; margin: 0; max-width: 80ch; }

.section { display: grid; gap: 10px; }
.section-head { display: flex; gap: 10px; align-items: baseline; margin-top: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--wait)); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.card-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: start; justify-content: space-between; }
.card-head .who { display: grid; gap: 2px; min-width: 0; }
.meta { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 3px 12px; }
.meta span { white-space: nowrap; }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; color: var(--c, var(--wait)); background: color-mix(in srgb, var(--c, var(--wait)) 13%, transparent); white-space: nowrap; }
.links { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 13.5px; }
.note { font-size: 13.5px; color: var(--muted); background: var(--soft); border-radius: 8px; padding: 6px 10px; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px 14px; }
.fig { display: grid; }
.fig .k { font-size: 12px; color: var(--muted); }
.fig .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.panel { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 10px; }

.convo { display: grid; gap: 8px; }
.msg { border-radius: 10px; padding: 9px 12px; border: 1px solid var(--line); }
.msg.in { background: var(--in-bg); border-left: 3px solid var(--needs); }
.msg.out { background: var(--out-bg); }
.msg.sys { background: transparent; border-style: dashed; color: var(--muted); font-size: 13.5px; }
.msg-head { display: flex; flex-wrap: wrap; gap: 3px 10px; justify-content: space-between; font-size: 13px; color: var(--muted); }
.msg-head b { color: var(--ink); }
.body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; font-size: 14.5px; max-width: 74ch; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details.msg > summary .msg-head::after { content: "Show"; color: var(--accent); font-weight: 600; }
details.msg[open] > summary .msg-head::after { content: "Hide"; }
.quoted summary { color: var(--accent); font-size: 13px; margin-top: 6px; }
.quoted .body { color: var(--muted); }
.compose { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.compose .lbl { font-weight: 700; font-size: 14px; }
.state { font-size: 13.5px; color: var(--muted); }
.state.ok { color: var(--good); font-weight: 600; }
.state.wait { color: var(--claude); font-weight: 600; }
.state.err { color: var(--bad); font-weight: 600; }
.confirm { background: color-mix(in srgb, var(--due) 12%, transparent); border-radius: 8px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.empty { color: var(--muted); padding: 22px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.hidden { display: none !important; }
#sf-gate { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 50; padding: 16px; }
#sf-gate[hidden] { display: none; }
#sf-gate form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 12px; width: min(380px, 100%); }
#sf-gate input { width: 100%; }
@media (max-width: 560px) { h1 { font-size: 22px; } .card { padding: 11px; } .kpi .v { font-size: 22px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="sf-gate" hidden>
  <form id="sf-gate-form">
    <h1>Subdivide Finder</h1>
    <p class="muted small" style="margin:0">Sign in with your Utopian CRM account.</p>
    <label class="f">Email<input type="email" id="sf-email" autocomplete="username" required></label>
    <label class="f">Password<input type="password" id="sf-pass" autocomplete="current-password" placeholder="Leave blank to get an email link"></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="small muted" id="sf-gate-msg" style="margin:0"></p>
  </form>
</div>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Subdivide Finder</h1>
      <div class="muted small" id="subline">Utopian Capital · on-market land over 10 acres, screened for subdivide flips</div>
    </div>
    <div class="fresh"><span id="sf-who"></span><a href="#" id="sf-signout" class="small">Sign out</a><span id="fresh"></span><button class="btn sm" id="refresh-btn" type="button">Check Gmail now</button></div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div id="banner-slot"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<script>
(function () {
  "use strict";
  var ME = "jay@utopiancapitalinvest.com";
  var TZ = "America/Chicago";
  var GMAIL = "Gmail";
  var PHONE = "(336) 962-2411";

  var STATES = "AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");
  var SCREENS = [
    { id: "Ready to offer", c: "var(--good)" },
    { id: "Verify with agent", c: "var(--claude)" },
    { id: "Need APN", c: "var(--due)" },
    { id: "Frontage short", c: "var(--wait)" },
    { id: "Steep", c: "var(--wait)" },
    { id: "Fail", c: "var(--bad)" }
  ];
  var SCOLOR = {}; SCREENS.forEach(function (s) { SCOLOR[s.id] = s.c; });
  var STAGES = [
    { id: "new", label: "New" }, { id: "contacting", label: "Contacting agent" }, { id: "talking", label: "In talks" },
    { id: "offer", label: "Offer out" }, { id: "contract", label: "Under contract" }, { id: "dead", label: "Dead" }
  ];
  var OFFER_STATUSES = ["Not submitted", "Submitted", "Countered", "Accepted", "Under contract", "Rejected", "Withdrawn"];
  var BUCKETS = [
    { id: "needs", label: "Agent replied: needs your call", short: "Needs your call", color: "var(--needs)" },
    { id: "draft", label: "Reply written: review and send", short: "Ready to send", color: "var(--claude)" },
    { id: "followup", label: "No reply yet: follow-up due", short: "Follow-up due", color: "var(--due)" },
    { id: "awaiting", label: "Waiting on the agent", short: "Waiting", color: "var(--wait)" },
    { id: "undelivered", label: "Not delivered", short: "Not delivered", color: "var(--bad)" },
    { id: "done", label: "Done", short: "Done", color: "var(--done)" }
  ];
  var BMAP = {}; BUCKETS.forEach(function (b) { BMAP[b.id] = b; });

  var TEMPLATE = [
    "Good [morning/afternoon] [Agent first name],",
    "",
    "I'm looking at your listing at [Property Address] and we're very interested in it. We're a serious buyer and actively buying land in and around [County] County. I wanted to reach out and learn a little more about the tract.",
    "",
    "How is the access to the property? Is there public road frontage, or does it come in off a private drive? If there is public road frontage, how many feet is there? Are you aware of any easements on the tract for access?",
    "",
    "Do you have the parcel number or APN, so we can pull it up on the county GIS map? If there's a survey available, could you send that over as well?",
    "",
    "Do you know what utilities are available out there, or whether they would have to be extended to the property? And are there any perc sites present on the property?",
    "",
    "If you have any additional pictures or videos of the tract, please send them my way!",
    "",
    "Feel free to shoot me a text or give me a call at my work number, " + PHONE + ". I look forward to hearing from you!",
    "",
    "Thank you,",
    "Jay"
  ].join("\n");

  var S = {
    db: null, mcp: null, sample: null, dbState: "loading", dbError: null,
    runs: [], deals: [], outreach: [], ideas: {},
    threads: {}, extras: {}, watching: {}, searchWatch: null, searchKey: null,
    gmail: { lastAt: null, error: null },
    tab: "deals",
    f: { run: "all", screen: "all", stage: "all", q: "" },
    inboxFilter: "all",
    open: {}, local: {}, busy: {}, err: {}, confirm: {}, composeOpen: {}
  };

  // ---------- helpers ----------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k === "className") el.className = v;
      else if (k === "value") el.value = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  function emailOf(s) { if (!s) return ""; var m = String(s).match(/<([^>]+)>/); return (m ? m[1] : String(s)).trim().toLowerCase(); }
  function nameOf(s) { var m = String(s || "").match(/^\s*"?([^"<]+?)"?\s*</); return m ? m[1] : emailOf(s); }
  function isMe(s) { return emailOf(s) === ME; }
  function isBounce(s) { return /mailer-daemon|postmaster/i.test(String(s || "")); }
  function firstName(n) { return String(n || "").trim().split(/[\s\/]+/)[0] || "there"; }
  function fmtDT(iso) { if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return ""; return d.toLocaleString("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function fmtDay(ymd) { if (!ymd) return ""; var d = new Date(ymd + "T12:00:00Z"); return isNaN(d) ? ymd : d.toLocaleDateString("en-US", { timeZone: "UTC", month: "short", day: "numeric" }); }
  function todayCT() { return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
  function ctParts() {
    var p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", hour12: false, weekday: "short" }).formatToParts(new Date());
    var o = {}; p.forEach(function (x) { o[x.type] = x.value; }); return { hour: (+o.hour) % 24, wd: o.weekday };
  }
  function offHours() { var p = ctParts(); return p.hour >= 19 || p.hour < 7 || p.wd === "Sat" || p.wd === "Sun"; }
  function greeting() { return ctParts().hour < 12 ? "Good morning" : "Good afternoon"; }
  function addBizDays(n) {
    var d = new Date(todayCT() + "T12:00:00Z"), k = 0;
    while (k < n) { d.setUTCDate(d.getUTCDate() + 1); var w = d.getUTCDay(); if (w !== 0 && w !== 6) k++; }
    return d.toISOString().slice(0, 10);
  }
  function ago(ms) { var s = Math.max(0, Math.round((Date.now() - ms) / 1000)); if (s < 60) return "just now"; var m = Math.round(s / 60); if (m < 60) return m + " min ago"; var hr = Math.round(m / 60); if (hr < 24) return hr + " hr ago"; return Math.round(hr / 24) + " days ago"; }
  function money(n) { return n == null || n === "" || isNaN(+n) ? "" : "$" + Math.round(+n).toLocaleString("en-US"); }
  function pct(n) { return n == null || isNaN(+n) ? "" : (Math.round(+n * 1000) / 10) + "%"; }
  function splitQuoted(t) {
    t = String(t || "").replace(/\r\n/g, "\n");
    var re = /(^|\n)[ \t>]*(On [\s\S]{0,300}?wrote:|-{2,}\s*Original Message\s*-{2,}|From: [^\n]+\n(?:Sent|Date): )/i;
    var m = re.exec(t);
    if (m && m.index > 10) return [t.slice(0, m.index).trim(), t.slice(m.index).trim()];
    return [t.trim(), ""];
  }
  function sampleErr(e) {
    var c = e && e.code;
    if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared") return "This account can't use Claude drafting. Make sure it's listed in sf_members.";
    if (c === "rate_limited") return "Claude is busy or you've hit a usage limit. Try again in a few minutes.";
    if (c === "session_expired") return "Sign in to Claude again, then try.";
    if (c === "refused") return "Claude declined this one. Change the idea and try again.";
    if (c === "invalid_json") return "Claude's answer came back malformed. Try again.";
    if (c === "cancelled") return "";
    return "Couldn't write it (" + (c || "error") + "). Try again.";
  }
  function gmailErr(e) {
    var c = e && e.code;
    if (c === "needs_reauth") return "Gmail isn't connected. Press Connect Gmail at the top, then send again. Nothing was sent.";
    if (c === "server_not_connected") return "Gmail isn't connected to your Claude account. Nothing was sent.";
    if (c === "not_in_manifest") return "Gmail is turned off for this page. Nothing was sent.";
    if (c === "approval_required") return "Sending needs your approval in claude.ai. Nothing was sent.";
    if (c === "tool_error") return "Gmail refused the email: " + (e.message || "unknown reason") + ".";
    return "Gmail didn't confirm the send (" + (c || "error") + "). Check your Sent folder before trying again.";
  }

  // ---------- derived ----------
  function convoFor(o) {
    var list = [];
    var main = S.threads[o.threadId];
    if (main && main.msgs) list = list.concat(main.msgs);
    Object.keys(S.extras).forEach(function (tid) { if (S.extras[tid] === o.threadId && S.threads[tid] && S.threads[tid].msgs) list = list.concat(S.threads[tid].msgs); });
    var seen = {};
    list = list.filter(function (m) { if (seen[m.id]) return false; seen[m.id] = 1; return true; });
    list.sort(function (a, b) { return (a.t || 0) - (b.t || 0); });
    return list;
  }
  function inboundOf(o) { return convoFor(o).filter(function (m) { return !isMe(m.from) && !isBounce(m.from); }); }
  function bucketFor(o) {
    var idea = S.ideas[o.threadId] || {};
    var msgs = convoFor(o);
    var inbound = msgs.filter(function (m) { return !isMe(m.from) && !isBounce(m.from); });
    var last = msgs.filter(function (m) { return !isBounce(m.from); }).slice(-1)[0];
    var bounced = o.delivery === "bounced" || msgs.some(function (m) { return isBounce(m.from); });
    if (idea.state === "done") return "done";
    var lastIn = inbound.length ? inbound[inbound.length - 1].t : 0;
    var draftFresh = idea.state === "draft" && idea.draft && (!idea.draftedAt || Date.parse(idea.draftedAt) >= lastIn);
    if (draftFresh) return "draft";
    if (inbound.length && last && !isMe(last.from)) return "needs";
    if (bounced && !inbound.length) return "undelivered";
    var due = idea.followUpDue || o.followUpDue;
    if (!inbound.length && due && todayCT() >= due) return "followup";
    return "awaiting";
  }
  function dealById(id) { for (var i = 0; i < S.deals.length; i++) if (S.deals[i].id === id) return S.deals[i]; return null; }

          r.status === "done" || r.status === "failed" ? h("button", { className: "btn sm", type: "button", onclick: function () { S.db.doc("runs/" + r.id).update({ status: "queued", requestedAt: new Date().toISOString(), note: "Re-run requested." }).catch(function () {}); }, text: "Run again" }) : null,
          r.status === "queued" ? h("button", { className: "btn sm ghost", type: "button", onclick: function () { S.db.doc("runs/" + r.id).delete().catch(function () {}); }, text: "Remove from queue" }) : null,
          r.workbook ? h("span", { className: "small muted", text: "Spreadsheet: " + r.workbook }) : null));
      root.appendChild(card);
    });
    return root;
  }
  function queueRun(st, key) {
    if (!S.db) return;
    var counties = String(st.counties || "").split(/[\n,;]+/).map(function (x) { return x.replace(/county$/i, "").trim(); }).filter(Boolean);
    if (!st.all && !counties.length) { S.err[key] = "Add at least one county, or tick the approved-counties box."; render(); return; }
    S.busy[key] = true; S.err[key] = null; render();
    var id = (st.state + "-" + (st.all ? "approved" : counties.join("-")) + "-" + todayCT()).toLowerCase().replace(/[^a-z0-9-]+/g, "-").slice(0, 120);
    S.db.doc("runs/" + id).set({ state: st.state, counties: st.all ? [] : counties, allApproved: !!st.all, minAcres: +st.minAcres || 10, label: st.label.trim(), status: "queued", requestedAt: new Date().toISOString() })
      .then(function () { S.busy[key] = false; delete S.local[key]; render(); })
      .catch(function (e) { S.busy[key] = false; S.err[key] = "Couldn't add it (" + ((e && e.code) || "error") + ")."; render(); });
  }

  // ---------- Gmail live ----------
  function parseThread(payload) {
    var t = payload && (payload.thread || payload) || {};
    var msgs = (t.messages || []).map(function (m) {
      var date = m.date || (m.internalDate ? new Date(+m.internalDate).toISOString() : null);
      return { id: m.id, from: m.sender || m.from || "", to: m.toRecipients || [], date: date, t: date ? Date.parse(date) : 0, subject: m.subject || "", snippet: m.snippet || "", body: m.plaintextBody || m.snippet || "",
        attachments: (m.attachments || []).map(function (a) { return a.filename || a.name; }).filter(Boolean) };
    });
    return { msgs: msgs, viewUrl: t.viewUrl || null };
  }
  function noteFresh(r) { var at = r && r.cache && r.cache.storedAt ? r.cache.storedAt : Date.now(); if (!S.gmail.lastAt || at > S.gmail.lastAt) S.gmail.lastAt = at; }
  var DENY = { needs_reauth: 1, server_not_connected: 1, blocked_by_policy: 1, approval_required: 1, not_in_manifest: 1, selection_required: 1 };
  function onError(tid, e) {
    e = e || { code: "upstream_error" };
    if (tid) { S.threads[tid] = S.threads[tid] || {}; if (DENY[e.code]) S.threads[tid].msgs = null; S.threads[tid].error = e; }
    S.gmail.error = e; render();
  }
  function watchThread(tid) {
    if (!S.mcp || !tid || S.watching[tid]) return;
    try {
      S.watching[tid] = S.mcp.watchTool(GMAIL, "get_thread", { threadId: tid, messageFormat: "PLAIN_TEXT" }, function (ev) {
        if (ev.type === "data") { var p = parseThread(ev.result && ev.result.payload); S.threads[tid] = { msgs: p.msgs, viewUrl: p.viewUrl, error: null }; S.gmail.error = null; noteFresh(ev.result); render(); }
        else onError(tid, ev.error);
      }, { cache: { staleTime: 120000, gcTime: 86400000 }, refetchInterval: 300000 });
    } catch (e) { onError(tid, { code: "bad_request" }); }
  }
  function watchSearch() {
    if (!S.mcp) return;
    var emails = {}, earliest = null;
    S.outreach.forEach(function (o) { (o.to || []).concat(o.cc || []).forEach(function (e) { emails[String(e).toLowerCase()] = o.threadId; }); var d = Date.parse(o.sentAt); if (!isNaN(d) && (earliest == null || d < earliest)) earliest = d; });
    var list = Object.keys(emails).slice(0, 40); if (!list.length) return;
    var after = new Date((earliest || Date.now()) - 86400000);
    var ymd = after.getUTCFullYear() + "/" + String(after.getUTCMonth() + 1).padStart(2, "0") + "/" + String(after.getUTCDate()).padStart(2, "0");
    var query = "from:(" + list.join(" OR ") + ") after:" + ymd;
    if (S.searchKey === query) return;
    if (S.searchWatch) { try { S.searchWatch(); } catch (e) {} }
    S.searchKey = query;
    try {
      S.searchWatch = S.mcp.watchTool(GMAIL, "search_threads", { query: query, pageSize: 50 }, function (ev) {
        if (ev.type !== "data") { onError(null, ev.error); return; }
        noteFresh(ev.result);
        var p = ev.result && ev.result.payload, threads = (p && p.threads) || [], tracked = {};
        S.outreach.forEach(function (o) { tracked[o.threadId] = 1; });
        threads.forEach(function (t) { if (!t || !t.id || tracked[t.id] || S.extras[t.id]) return; var owner = emails[emailOf(((t.messages || [])[0] || {}).sender)]; if (owner) { S.extras[t.id] = owner; watchThread(t.id); } });
        render();
      }, { cache: { staleTime: 120000, gcTime: 86400000 }, refetchInterval: 300000 });
    } catch (e) { onError(null, { code: "bad_request" }); }
  }
  function startGmail() { if (!S.mcp) return; S.outreach.forEach(function (o) { watchThread(o.threadId); }); watchSearch(); }
  function allowGmail() {
    var first = S.outreach.filter(function (o) { return o.threadId; })[0]; if (!S.mcp || !first) return;
    S.mcp.callTool(GMAIL, "get_thread", { threadId: first.threadId, messageFormat: "PLAIN_TEXT" }).then(function (r) {
      var p = parseThread(r.payload); S.threads[first.threadId] = { msgs: p.msgs, viewUrl: p.viewUrl, error: null }; S.gmail.error = null; noteFresh(r); render();
      if (S.mcp.invalidate) S.mcp.invalidate(GMAIL).catch(function () {});
    }).catch(function (e) { onError(first.threadId, e); });
  }
  document.getElementById("refresh-btn").addEventListener("click", function () { if (!S.mcp) return; S.gmail.error = null; render(); if (S.mcp.invalidate) S.mcp.invalidate(GMAIL).catch(function () {}); });
  setInterval(render, 60000);

  // ---------- boot ----------
  var hs = (location.hash || "").replace("#", ""); if (["deals", "inbox", "offers", "counties"].indexOf(hs) >= 0) S.tab = hs;
  window.addEventListener("hashchange", function () { var x = (location.hash || "").replace("#", ""); if (["deals", "inbox", "offers", "counties"].indexOf(x) >= 0 && x !== S.tab) { S.tab = x; render(); } });
  render();
  if (!window.claude || typeof window.claude.use !== "function") { S.dbState = "none"; render(); return; }
  var timer = null;
  var loaded = { runs: 0, deals: 0, outreach: 0 };
  function markLoaded(k, snap) { if (!snap.metadata.fromCache) loaded[k] = 1; if (loaded.runs && loaded.deals && loaded.outreach) { clearTimeout(timer); } if (S.dbState === "loading") S.dbState = "ready"; }
  function docs(snap) { return snap.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; }); }
  window.claude.use("db").then(function (db) {
    if (!db) { clearTimeout(timer); S.dbState = "none"; render(); return; }
    S.db = db;
    timer = setTimeout(function () { if (S.dbState === "loading") { S.dbState = "error"; S.dbError = "the data store didn't answer"; render(); } }, 15000);
    var fail = function (e) { clearTimeout(timer); S.dbState = "error"; S.dbError = e && e.code; render(); };
    db.collection("runs").onSnapshot(function (snap) { S.runs = docs(snap); markLoaded("runs", snap); render(); }, fail);
    db.collection("deals").onSnapshot(function (snap) { S.deals = docs(snap); markLoaded("deals", snap); render(); }, fail);
    db.collection("ideas").onSnapshot(function (snap) { var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); }); S.ideas = m; render(); }, function () {});
    db.collection("outreach").onSnapshot(function (snap) {
      S.outreach = docs(snap).map(function (x) { if (!x.threadId) x.threadId = x.id; return x; });
      markLoaded("outreach", snap); render(); startGmail();
    }, fail);
  }).catch(function () { clearTimeout(timer); S.dbState = "none"; render(); });
  window.claude.use("mcp").then(function (mcp) { S.mcp = mcp || null; render(); if (mcp) startGmail(); }).catch(function () { S.mcp = null; render(); });
  window.claude.use("sample").then(function (s) { S.sample = s || null; render(); }).catch(function () { S.sample = null; });
})();
</script>
</body>
